[tool.poetry]
name = "payments-py"
version = "1.18.0"
description = ""
authors = ["enrique <enrique@nevermined.io>", "Charly López <charly@nevermined.io>"]
readme = "README.md"
packages = [{include = "payments_py"}]
# poetry.lock is on lock-version 2.1; Poetry 1.x cannot read it. Surface the
# requirement upfront so contributors on older Poetry see a clear error.
requires-poetry = ">=2.1"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.0"
mkdocstrings = {version = "^1.0.6", extras = ["python"]}
mike = "^2.1.0"
pydantic = "^2.8.2"
pyjwt = "^2.9.0"
python-socketio = "^5.16.2"
aiohttp = "^3.10.8"
pytest-asyncio = "^1.2.0"
websocket-client = "^1.8.0"
black = "^26.1.0"
# Floor is 0.3.25, not 0.3.0: `ResultAggregator.consume_and_break_on_interrupt`
# returns `(result, interrupted, background_task)` only from 0.3.25 (a2a-python
# #775). `payments_request_handler` unpacks the triple, so 0.3.0-0.3.24 would
# raise ValueError on every `message/send`. The lock cannot catch this — only a
# downstream install resolving an older a2a-sdk would.
a2a-sdk = "^0.3.25"
helicone-helpers = "^1.1.1"
jsonschema = "^4.25.1"
mcp = "^1.25.0"
# Optional dependencies
fastapi = {version = "^0.141.1", optional = true}
starlette = {version = "^1.3.1", optional = true}
uvicorn = {version = "^0.53.0", optional = true}
strands-agents = {version = ">=1.0.0", optional = true}
langchain-core = {version = ">=0.3.0", optional = true}
langsmith = {version = ">=0.1.40,<1.0.0", optional = true}

[tool.poetry.extras]
fastapi = ["fastapi", "starlette", "uvicorn"]
strands = ["strands-agents"]
langchain = ["langchain-core"]
langsmith = ["langsmith", "fastapi", "starlette"]

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
requests-mock = "^1.11.0"
pytest-timeout = "^2.2.0"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
fastapi = "^0.141.1"
a2a-sdk = {version = "^0.3.25", extras = ["http-server"]}
uvicorn = "^0.53.0"
pytest-rerunfailures = "^16.6.1"
langgraph = "^1.0.10"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
#addopts = "-v --cov=payments_py --cov-report=term-missing"
timeout = 30

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"