name: Update Dependabot branches after merge

# Merges `main` into every open Dependabot branch so their CI runs against the
# `main` they would actually land on. Ported from
# nevermined-io/payments/.github/workflows/dependabot-update-branches.yml; the
# differences from that file are marked "payments-py:" throughout.
#
# payments-py: the reason the two repos need this is NOT the same one.
#
# On `payments`, `main` sets `strict: true`, so a branch that has fallen behind
# literally cannot merge and this job is what unblocks it. Here `main` sets
# `strict: false` (verified 2026-09-16, `gh api
# repos/nevermined-io/payments-py/branches/main/protection`), so nothing is
# blocked — which is exactly the problem. `dependabot-auto-merge.yml` approves
# and queues patch/minor bumps unattended, so without this job a bump merges
# green having been tested only against whatever `main` looked like when
# Dependabot opened it. The required checks (`lint`, `unit_integration`, `e2e`)
# re-run on the merge commit this job pushes, which is the safety property
# `strict: true` would enforce. It also makes flipping `strict: true` here a
# settings change rather than a settings change plus a backlog of stale
# branches.
#
# The header of `dependabot-auto-merge.yml` used to state the opposite — that
# the update-branches half of the `payments` pattern does not port to this repo.
# That was true of the `strict: true` justification and only that; it is
# corrected there alongside this file.
on:
  push:
    branches:
      - main
  # A push is the normal trigger, and it chains: each merge is itself a push,
  # so one wave feeds the next. That chain only holds while the PRs being served
  # actually merge — a wave spent entirely on majors awaiting human review ends
  # it, and nothing wakes the job again until someone lands something.
  #
  # Monday 09:00 UTC is the fallback for exactly that. Cron has no timezone, so
  # it has to clear Dependabot's own weekly run (Monday 08:00 Europe/Madrid, see
  # dependabot.yml) in both halves of the year: that is 06:00 UTC under CEST and
  # 07:00 UTC under CET, so an hour's margin in summer is none at all in winter.
  # 09:00 UTC leaves two hours in summer and one in winter, either side of the
  # switch, and Dependabot's own run is best-effort rather than punctual anyway.
  #
  # payments-py: that reasoning is only valid because `dependabot.yml` here now
  # pins `day`/`time`/`timezone` the way `payments` does. Before this PR it
  # specified `interval: weekly` alone, which leaves Dependabot free to pick the
  # hour, and no fixed cron could be said to clear it. If that pin is ever
  # removed, this cron goes back to being a guess.
  schedule:
    - cron: '0 9 * * 1'
  # The push trigger only fires post-merge, so a change to this workflow cannot
  # be exercised before it lands. Dispatch it by hand to read a real run.
  workflow_dispatch:

# One loop at a time: two overlapping runs would merge into the same branches.
concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      # payments-py: this job is never triggered by `dependabot[bot]` (push to
      # `main`, `schedule`, `workflow_dispatch`), so `secrets` resolves against
      # the *Actions* store — unlike `dependabot-auto-merge.yml`'s `auto-merge`
      # job, which runs as Dependabot and reads the Dependabot store. Both
      # copies exist: `RELEASE_APP_ID` and `RELEASE_APP_PRIVATE_KEY` are org
      # Actions secrets with `visibility: selected`, and `payments-py` is in the
      # selected list (verified 2026-09-16, `gh api
      # orgs/nevermined-io/actions/secrets/RELEASE_APP_ID/repositories`). If the
      # repo is ever dropped from that list this step fails loudly with "The
      # 'client-id' (or deprecated 'app-id') input must be set to a non-empty
      # string" — it is not a required check, so nothing would block; the
      # branches would simply stop being updated.
      - name: Generate release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Merge main into outdated Dependabot branches
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          # Each merge starts a full CI run against staging. Cap the fan-out per
          # push; the rest are picked up by the next run, and a merge is itself a
          # push to main, so the queue drains on its own.
          #
          # payments-py: 3 rather than the 5 `payments` uses. `test.yaml` sets no
          # `concurrency` group and its `e2e` job runs the real staging suite
          # with one shared pair of accounts (`TEST_SUBSCRIBER_API_KEY` /
          # `TEST_BUILDER_API_KEY`), so the cap is also the number of concurrent
          # staging suites this job can start. Raise it once E2E runs are
          # serialised, or if 3 proves to drain too slowly — the ceiling on open
          # Dependabot PRs here is 5 per ecosystem (`open-pull-requests-limit`).
          MAX_MERGES: 3
        run: |
          set -uo pipefail

          # History, so the next reader does not redo it:
          #
          # - This shipped on `payments` calling `--method POST` on
          #   /pulls/{n}/update-branch, which is a PUT endpoint. Every call 404'd
          #   and a trailing `|| echo "skipped"` printed that as a benign line
          #   under a green job, so no branch was ever updated (run
          #   34743328585, 2026-09-13: all 21 open PRs 404; output quoted in
          #   nevermined-io/payments#449).
          # - Commenting `@dependabot rebase` would be the better mechanism —
          #   Dependabot regenerates the lockfile conflicts a merge cannot — but
          #   it refuses commands from GitHub App identities ("Sorry, only users
          #   with push access can use that command",
          #   dependabot/dependabot-core#9147, open). This job runs as the
          #   release bot, so its comment would be ignored while `gh pr comment`
          #   still exits 0.
          # - `PUT /pulls/{n}/update-branch` works, but answers 202: the merge is
          #   queued, so confirming it meant polling `compare/{base}...{head}`,
          #   and that compare races a moving `main` — a push landing inside the
          #   window makes a branch that *was* updated read as still behind.
          #
          # `POST /repos/{owner}/{repo}/merges` avoids all three. It is
          # synchronous, App-enabled, and takes `commit_message`, which matters:
          # "Dependabot will stop rebasing a pull request once extra commits have
          # been pushed to it", unless the message carries `[dependabot skip]`
          # (or `[skip dependabot]`, `[dependabot-skip]`, `[skip-dependabot]`).
          # So the marker is meant to keep Dependabot's own rebase — the thing
          # that regenerates a conflicted lockfile — alive on branches this job
          # has touched. Two limits on that claim:
          #
          # - It does not lift the other cutoff in the same docs section: "If a
          #   pull request has not been merged for 30 days, Dependabot will stop
          #   rebasing the pull request."
          # - Whether Dependabot honours it on an App-authored commit is
          #   documented nowhere, and no run of this job can tell you: a run only
          #   shows the commit landing with the marker in its message. It is
          #   observable only when Dependabot next tries to rebase such a branch,
          #   which nothing here watches. If it turns out to be ignored, the loss
          #   is silent — touched PRs strand at their first conflict and the
          #   warning below becomes the steady state rather than the exception.
          #
          # Measured against the real API on `payments` on 2026-09-14:
          #   201 Created  — #356, commit 8dbd041 carrying the marker verbatim
          #   204 No Content — same call repeated, branch already current
          #   409 Merge conflict — #39, which is DIRTY
          echo "Looking for open Dependabot PRs..."
          # Approved first, least-recently-updated within each half. A slot spent
          # on a PR nobody has approved buys nothing: it cannot merge, so it
          # cannot produce the push that starts the next wave. Serving the
          # approved ones first means every wave that has one ends in a merge.
          prs=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --search "author:app/dependabot sort:updated-asc" \
            --limit 100 \
            --json number,headRefName,reviewDecision \
            --jq '[.[] | select(.reviewDecision == "APPROVED")] + [.[] | select(.reviewDecision != "APPROVED")]
                  | .[] | "\(.number) \(.headRefName)"')

          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          # Least-recently-updated first, which is what makes the queue drain. A
          # fixed order — by number, by creation date — feeds run N+1 the same
          # head of the list as run N and never reaches the tail. A merge bumps
          # that PR's updatedAt and sends it to the back: round-robin.
          merged=0
          conflicted=0
          while read -r pr branch; do
            if [ -z "$pr" ]; then
              continue
            fi

            if [ "$merged" -ge "$MAX_MERGES" ]; then
              echo "Reached MAX_MERGES=$MAX_MERGES; the rest wait for the next run."
              break
            fi

            # -i so the 204 (already current) is distinguishable from the 201.
            if out=$(gh api -i \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/merges" \
              -f base="$branch" \
              -f head="$BASE" \
              -f commit_message="Merge $BASE into $branch to satisfy strict status checks [dependabot skip]" 2>&1); then
              case "$out" in
                *"HTTP/2.0 204"*|*"HTTP/1.1 204"*)
                  echo "PR #$pr is already current."
                  continue;;
              esac
              echo "PR #$pr updated."
              merged=$((merged + 1))
              continue
            fi

            case "$out" in
              *"Merge conflict"*)
                # A merge cannot resolve a poetry.lock conflict. The marker on
                # this job's earlier commits keeps Dependabot's own rebase
                # available, but a conflict it has already given up on needs a
                # person.
                echo "::warning title=Dependabot PR conflicted::PR #$pr ($branch) — comment '@dependabot recreate' from a user account"
                conflicted=$((conflicted + 1))
                continue;;
            esac

            echo "::error title=Branch merge failed::PR #$pr ($branch): $out"
            exit 1
          done <<EOF
          $prs
          EOF

          echo "Merged into $merged branch(es); $conflicted conflicted."
