name: Update Dependabot branches after merge

# Merges `main` into every open Dependabot branch so their CI runs against the
# `main` they would actually land on. Ported from
# nevermined-io/payments/.github/workflows/dependabot-update-branches.yml; the
# differences from that file are marked "payments-py:" throughout.
#
# payments-py: READ THIS BEFORE RELYING ON IT — what it does and does not do.
#
# On `payments`, `main` sets `strict: true`, so a branch that has fallen behind
# literally cannot merge and this job is what unblocks it. There the guarantee
# is branch protection's; this job only supplies the merges it demands.
#
# Here `main` sets `strict: false` (verified 2026-09-16, `gh api
# repos/nevermined-io/payments-py/branches/main/protection`). This job is
# therefore BEST-EFFORT and enforces nothing. An earlier version of this
# comment claimed it delivers "the safety property `strict: true` would
# enforce"; that was wrong and review caught it (#287). Concretely, it does not
# close the stale-branch race:
#
#  - `dependabot-auto-merge.yml` arms a patch/minor PR as soon as it opens. If
#    its checks go green on the original head before anything lands on `main`,
#    GitHub merges it and this job never saw it.
#  - The sweep is asynchronous. Nothing makes it a prerequisite of a merge:
#    there is no required check for it, and neither the push trigger nor the
#    weekly cron runs between a PR's checks going green and its auto-merge.
#  - `MAX_MERGES` caps each wave, so with more open PRs than the cap some stay
#    unswept while remaining perfectly mergeable.
#
# What it does buy, which is real but smaller: a Dependabot PR that sits — held
# for review, blocked on a conflict, or behind others in the queue — gets
# `lint`, `unit_integration` and `e2e` re-run against a current `main` instead
# of merging on checks from whenever Dependabot opened it. That covers the
# backlog case this repository actually hits, and it is what makes turning
# `strict: true` on later a settings change rather than a settings change plus
# a pile of stale branches to unblock by hand.
#
# If the race matters rather than the backlog, the fix is `strict: true` on
# `main` — branch protection is the only thing that can gate a merge on an
# up-to-date branch — at which point this job becomes the unblocker it is on
# `payments` and the paragraph above can be replaced by that one. The header of
# `dependabot-auto-merge.yml` tracks the same distinction.
on:
  push:
    branches:
      - main
  # A push is the normal trigger, and it chains: each merge is itself a push,
  # so one wave feeds the next. That chain only holds while the PRs being served
  # actually merge — a wave spent entirely on majors awaiting human review ends
  # it, and nothing wakes the job again until someone lands something.
  #
  # Monday 09:00 UTC is the fallback for exactly that. Cron has no timezone, so
  # it has to clear Dependabot's own weekly run (Monday 08:00 Europe/Madrid, see
  # dependabot.yml) in both halves of the year: 08:00 Madrid is 06:00 UTC under
  # CEST and 07:00 UTC under CET, so 09:00 UTC leaves three hours in summer and
  # two in winter, either side of the switch. (The `payments` copy states two
  # and one; that is an arithmetic slip, corrected here — review caught it in
  # #287. The conclusion is unchanged, and the margin is wider than claimed,
  # not narrower.) Dependabot's own run is best-effort rather than punctual
  # anyway, which is why the margin is in hours and not minutes.
  #
  # payments-py: that reasoning is only valid because `dependabot.yml` here now
  # pins `day`/`time`/`timezone` the way `payments` does. Before this PR it
  # specified `interval: weekly` alone, which leaves Dependabot free to pick the
  # hour, and no fixed cron could be said to clear it. If that pin is ever
  # removed, this cron goes back to being a guess.
  schedule:
    - cron: '0 9 * * 1'
  # The push trigger only fires post-merge, so a change to this workflow cannot
  # be exercised before it lands. Dispatch it by hand to read a real run.
  # `tests/unit/test_dependabot_sweeper.py` is what covers the logic pre-merge.
  workflow_dispatch:

# One loop at a time: two overlapping runs would merge into the same branches.
concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      # payments-py: this job is never triggered by `dependabot[bot]` (push to
      # `main`, `schedule`, `workflow_dispatch`), so `secrets` resolves against
      # the *Actions* store — unlike `dependabot-auto-merge.yml`'s `auto-merge`
      # job, which runs as Dependabot and reads the Dependabot store. Both
      # copies exist: `RELEASE_APP_ID` and `RELEASE_APP_PRIVATE_KEY` are org
      # Actions secrets with `visibility: selected`, and `payments-py` is in the
      # selected list (verified 2026-09-16, `gh api
      # orgs/nevermined-io/actions/secrets/RELEASE_APP_ID/repositories`). If the
      # repo is ever dropped from that list this step fails loudly with "The
      # 'client-id' (or deprecated 'app-id') input must be set to a non-empty
      # string" — it is not a required check, so nothing would block; the
      # branches would simply stop being updated.
      - name: Generate release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Checking out is safe HERE, and the distinction is worth stating because
      # `dependabot-auto-merge.yml` makes a point of never doing it. That file
      # runs on `pull_request` with the App token in scope, so a checkout would
      # put an untrusted Dependabot branch's code next to a privileged
      # credential. This job's triggers — push to `main`, `schedule`,
      # `workflow_dispatch` — all resolve to the default branch, so what lands
      # in the working tree is `main` and nothing else. No Dependabot branch is
      # ever checked out, and nothing from one is executed: the branches this
      # job writes to are only ever named in an API call.
      - uses: actions/checkout@v7

      - name: Merge main into outdated Dependabot branches
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          # Each merge starts a full CI run against staging. Cap the fan-out per
          # push; the rest are picked up by the next run, and a merge is itself a
          # push to main, so the queue drains on its own.
          #
          # payments-py: 3 rather than the 5 `payments` uses. `test.yaml` sets no
          # `concurrency` group and its `e2e` job runs the real staging suite
          # with one shared pair of accounts (`TEST_SUBSCRIBER_API_KEY` /
          # `TEST_BUILDER_API_KEY`), so the cap is also the number of concurrent
          # staging suites this job can start. Raise it once E2E runs are
          # serialised, or if 3 proves to drain too slowly — the ceiling on open
          # Dependabot PRs here is 5 per ecosystem (`open-pull-requests-limit`).
          MAX_MERGES: 3
        # payments-py: the logic lives in a script rather than inline so that
        # `tests/unit/test_dependabot_sweeper.py` can drive it with a stubbed
        # `gh`. This workflow's trigger is a push to `main`, so a change to it
        # cannot be exercised before it lands; that suite is the only pre-merge
        # check the selection, ordering, status handling and cap get.
        run: .github/scripts/update-dependabot-branches.sh
