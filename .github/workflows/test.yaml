# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit_integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      # No secrets here on purpose. `TEST_SUBSCRIBER_API_KEY` /
      # `TEST_BUILDER_API_KEY` have no reader outside `tests/e2e/`, which this
      # `-m "not slow"` selection excludes, and `tests/e2e/conftest.py` only
      # `os.getenv`s them at import — so the block that used to sit here handed
      # both keys to Dependabot-branch code that never read them. (It passed on
      # the pre-#278 Dependabot runs with the store empty: 30943984001,
      # 30929380126.) The `e2e` job, which does read them, carries its own.
      - name: Run unit and integration tests
        run: poetry run pytest -m "not slow" -v -s

  deepagents_compat:
    runs-on: ubuntu-latest
    # Deep Agents compatibility (tests/unit/x402/test_deepagents_compat.py).
    #
    # Runs as its own job rather than inside `unit_integration` because that
    # job deliberately pins Python 3.10 — the floor this package declares
    # (`python = "^3.10"`) — while deepagents requires >=3.11, so it installs
    # with pip in a clean 3.11 environment instead of through the shared poetry
    # lock. Keeping it separate means the 3.10 floor stays tested and this
    # contract still runs.
    #
    # The LangChain v1 stack is no longer a second reason: the test group used
    # to pin `langgraph = "^0.6.0"`, disjoint from the >=1.2.11 deepagents
    # needs, but it now tracks `^1.0.10` and the lock resolves 1.2.11.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the SDK and the Deep Agents harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[langchain,langsmith]"
          pip install deepagents pytest pytest-timeout pytest-asyncio
      - name: Run Deep Agents compatibility tests
        # -p no:randomly / no markers: these are pure unit tests, no network.
        run: pytest tests/unit/x402/test_deepagents_compat.py -v

  e2e:
    runs-on: ubuntu-latest

    needs: unit_integration
    # Fork PRs skip: a fork-PR run gets no repository secrets from either store,
    # so both keys arrive empty and every test fails identically in
    # `_parse_nvm_api_key`. A job skipped by this `if:` reports conclusion
    # `skipped`, which SATISFIES the required check — that is how a fork PR
    # merges at all (gate added in #206; #215 and #181 both merged into
    # protected `main` with `e2e: skipped`).
    #
    # Dependabot runs are no longer skipped — they were from #278 until #284,
    # while this repository's *Dependabot* secret store sat empty and `e2e`, a
    # required check, could never pass; 18 Dependabot PRs piled up that way.
    # Which store a run reads is chosen by the ACTOR of the triggering event,
    # not by the PR author: `dependabot[bot]` (including `@dependabot rebase`)
    # reads the Dependabot store, while a human fix-up push to the same
    # `dependabot/*` branch reads the Actions one — so a bad Dependabot copy
    # looks like a per-push flake on one PR. Running this for real matters here:
    # a bump can rewire the credit-burn path — a2a-sdk 0.3.25 changed the arity
    # of the call that carries it (#278) — and `tests/e2e/test_a2a_e2e.py`
    # asserts the exact burn. Rotation procedure: `tests/e2e/README.md`.
    #
    # Security trade, stated precisely because the wrong version of it is what a
    # reader acts on: the keys are STEP-scoped (`Run E2E tests` below), so
    # `poetry install` and its package build hooks run WITHOUT them. The
    # exposure is `poetry run pytest -m "slow"`, which imports and executes the
    # bumped dependency — and anything a build hook planted in the venv — with
    # the keys in `os.environ` and in use over the network. Acceptable BECAUSE
    # the Dependabot store was seeded from the staging keys already committed in
    # `tests/e2e/conftest.py`, so a Dependabot run exposes nothing a `git clone`
    # does not. Do NOT overwrite it with the rotated Actions keys unless you
    # accept exposing a non-public credential to dependency code on every
    # Dependabot PR.
    #
    # Reading a Dependabot run:
    #
    #  - `e2e: skipped` is usually `needs: unit_integration` having failed, not
    #    a secrets problem: a job whose `needs` failed is skipped before its
    #    `if:` is evaluated, and the Jobs API reports both causes identically.
    #    Evidence that the keys work has to come from the first Dependabot PR
    #    whose `unit_integration` passes — `e2e` not `skipped`, and a summary
    #    with no `errors` and no `Invalid NVM API Key`. `passed > 0` is not
    #    evidence; 11 tests passed on empty keys before #278.
    #  - `continue-on-error: true` does NOT green a failed required check. It
    #    rewrites the workflow-RUN conclusion, while branch protection reads the
    #    CHECK-RUN conclusion, which stays `failure` and blocks (runs
    #    30943984001 / 30929380126: `e2e: failure` inside a `success` run, on
    #    PRs that stayed blocked). Its real effect is the post-merge `push` run,
    #    where a failing E2E on `main` reports green — run 34108722286, tracked
    #    in #280. Read the job, not the run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Run E2E tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
        run: poetry run pytest -m "slow" -v -s
