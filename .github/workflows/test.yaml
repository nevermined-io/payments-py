# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit_integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Run unit and integration tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
        run: poetry run pytest -m "not slow" -v -s

  deepagents_compat:
    runs-on: ubuntu-latest
    # Deep Agents compatibility (tests/unit/x402/test_deepagents_compat.py).
    #
    # Runs as its own job rather than inside `unit_integration` because that
    # job deliberately pins Python 3.10 — the floor this package declares
    # (`python = "^3.10"`) — while deepagents requires >=3.11, so it installs
    # with pip in a clean 3.11 environment instead of through the shared poetry
    # lock. Keeping it separate means the 3.10 floor stays tested and this
    # contract still runs.
    #
    # The LangChain v1 stack is no longer a second reason: the test group used
    # to pin `langgraph = "^0.6.0"`, disjoint from the >=1.2.11 deepagents
    # needs, but it now tracks `^1.0.10` and the lock resolves 1.2.11.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the SDK and the Deep Agents harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[langchain,langsmith]"
          pip install deepagents pytest pytest-timeout pytest-asyncio
      - name: Run Deep Agents compatibility tests
        # -p no:randomly / no markers: these are pure unit tests, no network.
        run: pytest tests/unit/x402/test_deepagents_compat.py -v

  e2e:
    runs-on: ubuntu-latest

    needs: unit_integration
    # Skip on fork PRs: GitHub does not pass repo secrets to fork-PR runs, so
    # TEST_SUBSCRIBER_API_KEY / TEST_BUILDER_API_KEY are empty and every test
    # fails identically when the SDK tries to parse the empty key. Run on push
    # events (main) and on pull_request events from same-repo branches.
    #
    # Skip on Dependabot runs for the same reason: repository secrets are not
    # exposed to `dependabot[bot]` (they would have to live in the separate
    # Dependabot secret store, which this repo does not populate), so the keys
    # arrive empty and every E2E test errors in `_parse_nvm_api_key` with
    # "ValueError: not enough values to unpack (expected 2, got 1)". `e2e` is a
    # required status check, so that turns every Dependabot PR unmergeable —
    # which is how 18 of them piled up. A job skipped by this `if` reports
    # conclusion `skipped`, which satisfies the required check: the fork gate
    # came in with #206, and the fork PRs that exercised it — #215 and #181 —
    # both merged into protected `main` with `e2e: skipped`.
    #
    # Gated on `github.actor`, the actor of the triggering event, and not on the
    # PR author: when a human pushes to a `dependabot/*` branch to fix up a bump,
    # the actor is that human, secrets are available, and E2E runs as normal.
    #
    # Note this keys on the actor, not on whether the secrets are actually
    # present: populating TEST_SUBSCRIBER_API_KEY / TEST_BUILDER_API_KEY in the
    # repository's *Dependabot* secret store would let E2E run on Dependabot
    # PRs once this clause is dropped, and make it unnecessary — the better end
    # state for a repo where a bump can rewire the credit-burn path. Until then a
    # Dependabot bump merges with E2E never executed, and the post-merge `push`
    # run below is `continue-on-error` and not a required check — a failing
    # post-merge E2E still reports the run green (measured: run 34108722286,
    # `e2e: failure` inside a `success` run). Tracked in #280.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Run E2E tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
        run: poetry run pytest -m "slow" -v -s
