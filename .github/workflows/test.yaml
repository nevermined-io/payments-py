# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit_integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Run unit and integration tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
        run: poetry run pytest -m "not slow" -v -s

  deepagents_compat:
    runs-on: ubuntu-latest
    # Deep Agents compatibility (tests/unit/x402/test_deepagents_compat.py).
    #
    # Runs as its own job rather than inside `unit_integration` because that
    # job deliberately pins Python 3.10 — the floor this package declares
    # (`python = "^3.10"`) — while deepagents requires >=3.11, so it installs
    # with pip in a clean 3.11 environment instead of through the shared poetry
    # lock. Keeping it separate means the 3.10 floor stays tested and this
    # contract still runs.
    #
    # The LangChain v1 stack is no longer a second reason: the test group used
    # to pin `langgraph = "^0.6.0"`, disjoint from the >=1.2.11 deepagents
    # needs, but it now tracks `^1.0.10` and the lock resolves 1.2.11.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the SDK and the Deep Agents harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[langchain,langsmith]"
          pip install deepagents pytest pytest-timeout pytest-asyncio
      - name: Run Deep Agents compatibility tests
        # -p no:randomly / no markers: these are pure unit tests, no network.
        run: pytest tests/unit/x402/test_deepagents_compat.py -v

  e2e:
    runs-on: ubuntu-latest

    needs: unit_integration
    # Skip on fork PRs: GitHub does not pass repo secrets to fork-PR runs, so
    # TEST_SUBSCRIBER_API_KEY / TEST_BUILDER_API_KEY are empty and every test
    # fails identically when the SDK tries to parse the empty key. Run on push
    # events (main) and on pull_request events from same-repo branches.
    #
    # Dependabot runs are NO LONGER skipped. They were, from #278 until now,
    # because a workflow triggered by `dependabot[bot]` reads the repository's
    # *Dependabot* secret store — a store entirely separate from the Actions one
    # — and this repo had left it empty, so the keys arrived blank and every E2E
    # test errored in `_parse_nvm_api_key` with "ValueError: not enough values to
    # unpack (expected 2, got 1)". With `e2e` a required check, that made every
    # Dependabot PR unmergeable; 18 of them piled up that way.
    #
    # `TEST_SUBSCRIBER_API_KEY` / `TEST_BUILDER_API_KEY` now exist in the
    # Dependabot store, so the job runs for real on a Dependabot PR instead of
    # reporting `skipped`. That matters more here than in most repos: a
    # dependency bump in this SDK can rewire the credit-burn path — a2a-sdk
    # 0.3.25 changed the arity of the call that carries it (#278) — and E2E is
    # where that shows up. Skipping it meant bumps merged on unit tests alone.
    #
    # Operational note for whoever rotates these: the two stores hold SEPARATE
    # copies. Updating the Actions secret does NOT update the Dependabot one, and
    # nothing warns you — E2E simply starts failing on Dependabot PRs only. The
    # values seeded into the Dependabot store were the committed staging-sandbox
    # fallbacks from `tests/e2e/conftest.py`, which had not been touched since
    # 2025-12-03 while the Actions secrets were rotated on 2026-07-24; they are
    # therefore probably NOT the same keys, only equivalent ones. Both pass the
    # suite (77 passed / 26 skipped either way).
    #
    # Worth knowing about the trade: this job checks out the Dependabot branch
    # and runs `poetry install`, which executes package build hooks — arbitrary
    # code from the bumped dependency — with these keys in the environment. That
    # is the reason GitHub keeps the two stores apart. Acceptable here because
    # these are staging-sandbox test accounts whose equivalents are already
    # committed in the repository, but it is not zero risk.
    #
    # The post-merge `push` run below is still `continue-on-error` and not a
    # required check, so a failing E2E on `main` reports the run green (measured:
    # run 34108722286, `e2e: failure` inside a `success` run). Tracked in #280.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"
      - name: Install poetry
        run: pip install "poetry>=2.1,<3"
      - name: Resolve lockfile
        run: poetry lock --no-interaction --no-ansi
      - name: Install the project dependencies
        run: poetry install --with test --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Run E2E tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
        run: poetry run pytest -m "slow" -v -s
