version: 2
updates:
  # Python dependencies. Dependabot reads Poetry projects through the `pip`
  # ecosystem (pyproject.toml + poetry.lock).
  #
  # This entry replaces an `npm` one that had been here since the first commit:
  # there is no package.json in this repository, so it matched nothing and no
  # version updates were ever configured. Every Dependabot PR this repo has
  # received came from *security* updates, which run off the dependency graph
  # and ignore this file — one ungrouped PR per advisory, which is how 18 of
  # them accumulated.
  #
  # Both kinds are grouped: `applies-to` defaults to version-updates, so
  # security updates need their own group to be batched as well.
  - package-ecosystem: 'pip'
    directory: '/'
    # Pinned rather than left to Dependabot's choice of hour, because
    # `dependabot-update-branches.yml` schedules its weekly fallback to clear
    # this run (Monday 09:00 UTC), and a fallback can only be said to clear a
    # run that happens at a known time. Same values as
    # nevermined-io/payments, so the two repos' Dependabot waves line up.
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Minor and patch only. `dependabot/fetch-metadata` reports the HIGHEST
      # update-type in a group, so a single major in this batch would report
      # `semver-major` and hold every routine bump with it in
      # `dependabot-auto-merge.yml`. Majors are excluded here and therefore
      # arrive as individual PRs, which is what they want anyway — #282 bumped
      # a2a-sdk to 1.1.2 and removed `TextPart` from `a2a.types`.
      python-version-updates:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # Actions referenced by .github/workflows/*. Never configured before, so the
  # pinned majors here have gone stale without anything proposing bumps.
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Pinned rather than left to Dependabot's choice of hour, because
    # `dependabot-update-branches.yml` schedules its weekly fallback to clear
    # this run (Monday 09:00 UTC), and a fallback can only be said to clear a
    # run that happens at a known time. Same values as
    # nevermined-io/payments, so the two repos' Dependabot waves line up.
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # Same minor+patch restriction, and for the same reason as the pip group
      # above: without it a grouped actions PR carrying one major reports
      # `semver-major` to `dependabot/fetch-metadata` and holds the whole batch.
      # An action major (v3 -> v4) is exactly the bump that wants reading
      # anyway, so it arrives as its own PR.
      github-actions:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
